<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon G52 - Buscador de Información</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1e293b;
        }

        /* Buscador */
        .search-box {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8fafc;
        }

        .search-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        /* Tabla */
        .table-box {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background-color: #ffffff;
            min-height: 250px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .table-box h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #475569;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .keywords {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* Botón Subir Texto */
        .actions-bar {
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #94a3b8;
            color: white;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background-color: #64748b;
        }

        /* Modal Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
            font-size: 0.9rem;
        }

        .form-group input[type="text"], 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .file-upload-box {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
        }

        .file-upload-box input {
            font-size: 0.85rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Buscar información en la base de datos</h1>

        <!-- Campo de Búsqueda -->
        <div class="search-box">
            <label for="searchInput">Buscar</label>
            <input type="text" id="searchInput" placeholder="Escriba para buscar por texto o categoría..." oninput="filtrarTabla()">
        </div>

        <!-- Tabla Principal -->
        <div class="table-box">
            <h2>Mostrar</h2>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Texto</th>
                        <th>Categoría</th>
                        <th>Probabilidad</th>
                        <th>Palabras Clave</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <!-- Filas cargadas dinámicamente desde Java/Supabase -->
                </tbody>
            </table>
        </div>

        <!-- Botón para abrir el Pop-up -->
        <div class="actions-bar">
            <button class="btn btn-primary" onclick="abrirModal()">Subir texto</button>
        </div>
    </div>

    <!-- Modal Pop-up -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Información a clasificar</h2>
            
            <div class="form-group">
                <label for="tituloInput">Título / Asunto</label>
                <input type="text" id="tituloInput" placeholder="Ej: Redes neuronales en PyTorch">
            </div>

            <div class="form-group">
                <label for="textoInput">Texto a clasificar</label>
                <textarea id="textoInput" placeholder="Copie y pegue aquí el contenido o cargue un archivo .txt..."></textarea>
            </div>

            <!-- Cargar archivo .txt -->
            <div class="file-upload-box">
                <label for="fileInput" style="display:block; font-size: 0.8rem; font-weight:600; margin-bottom: 4px;">O cargar archivo .txt:</label>
                <input type="file" id="fileInput" accept=".txt" onchange="leerArchivoTxt(event)">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" id="btnConfirmar" onclick="guardarTexto()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/contenido';

        // Cargar datos al iniciar la pantalla
        document.addEventListener('DOMContentLoaded', () => {
            cargarTabla();
        });

        // 1. GET: Consultar los registros guardados
        async function cargarTabla(query = '') {
            try {
                const url = query ? `${API_URL}?query=${encodeURIComponent(query)}` : API_URL;
                const response = await fetch(url);
                const datos = await response.json();
                renderizarTabla(datos);
            } catch (error) {
                console.error('Error al cargar la tabla:', error);
            }
        }

        // Renderizar las filas recibidas de Supabase
        function renderizarTabla(lista) {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if (!lista || lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No se encontraron registros.</td></tr>';
                return;
            }

            lista.forEach(item => {
                const tr = document.createElement('tr');
                
                // Adaptación flexible según la estructura recibida
                const titulo = item.titulo || item.contenido?.titulo || 'Sin título';
                const texto = item.texto || item.contenido?.texto || 'Sin texto';
                const categoria = item.categoria || item.categoriaEntity?.descripcion || 'Sin categoría';
                const probabilidad = item.probabilidad ? `${(item.probabilidad * 100).toFixed(1)}%` : 'N/A';
                
                const palabrasClave = item.informacion_adicional || item.informacionAdicional || [];
                const tagsHtml = palabrasClave.map(p => `<span class="tag">${p}</span>`).join(' ');

                tr.innerHTML = `
                    <td><strong>${escapeHtml(titulo)}</strong></td>
                    <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(texto)}</td>
                    <td><span class="badge">${escapeHtml(categoria)}</span></td>
                    <td>${probabilidad}</td>
                    <td><div class="keywords">${tagsHtml}</div></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. Buscador en tiempo real
        function filtrarTabla() {
            const query = document.getElementById('searchInput').value;
            cargarTabla(query);
        }

        // 3. POST: Enviar texto del Pop-up a Spring Boot
        async function guardarTexto() {
            const titulo = document.getElementById('tituloInput').value.trim();
            const texto = document.getElementById('textoInput').value.trim();
            const btnConfirmar = document.getElementById('btnConfirmar');

            if (!titulo || !texto) {
                alert('Por favor complete tanto el título como el texto.');
                return;
            }

            try {
                btnConfirmar.innerText = "Procesando...";
                btnConfirmar.disabled = true;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo: titulo, texto: texto })
                });

                if (response.ok) {
                    cerrarModal();
                    cargarTabla(); // Recarga la tabla en vivo con la nueva clasificación
                } else {
                    const errData = await response.json();
                    alert('Error: ' + JSON.stringify(errData));
                }
            } catch (error) {
                console.error('Error al guardar:', error);
                alert('Ocurrió un error al conectar con el servidor.');
            } finally {
                btnConfirmar.innerText = "Confirmar";
                btnConfirmar.disabled = false;
            }
        }

        // Lector de archivos .txt para el Pop-up
        function leerArchivoTxt(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('textoInput').value = e.target.result;
                if (!document.getElementById('tituloInput').value) {
                    // Usa el nombre del archivo como título por defecto
                    document.getElementById('tituloInput').value = file.name.replace('.txt', '');
                }
            };
            reader.readAsText(file);
        }

        // Manejo de la ventana Modal
        function abrirModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('tituloInput').value = '';
            document.getElementById('textoInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
