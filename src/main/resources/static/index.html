<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon G52 - Buscador de Información</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h1>Buscar información en la base de datos</h1>

        <!-- Campo de Búsqueda -->
        <div class="search-box">
            <label for="searchInput">Buscar</label>
            <input type="text" id="searchInput" placeholder="Escriba para buscar por texto o categoría..." oninput="filtrarTabla()">
        </div>

        <!-- Tabla Principal -->
        <div class="table-box">
            <h2>Mostrar</h2>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Texto</th>
                        <th>Categoría</th>
                        <th>Probabilidad</th>
                        <th>Palabras Clave</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <!-- Filas cargadas dinámicamente desde Java/Supabase -->
                </tbody>
            </table>
        </div>

        <!-- Botón para abrir el Pop-up -->
        <div class="actions-bar">
            <button class="btn btn-primary" onclick="abrirModal()">Subir texto</button>
        </div>
    </div>

    <!-- Modal Pop-up -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Información a clasificar</h2>
            
            <div class="form-group">
                <label for="tituloInput">Título / Asunto</label>
                <input type="text" id="tituloInput" placeholder="Ej: Redes neuronales en PyTorch">
            </div>

            <div class="form-group">
                <label for="textoInput">Texto a clasificar</label>
                <textarea id="textoInput" placeholder="Copie y pegue aquí el contenido o cargue un archivo .txt..."></textarea>
            </div>

            <!-- Cargar archivo .txt -->
            <div class="file-upload-box">
                <label for="fileInput" style="display:block; font-size: 0.8rem; font-weight:600; margin-bottom: 4px;">O cargar archivo .txt:</label>
                <input type="file" id="fileInput" accept=".txt" onchange="leerArchivoTxt(event)">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" id="btnConfirmar" onclick="guardarTexto()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
